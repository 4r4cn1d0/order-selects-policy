[project]
name = "path-dependent-value-formation"
version = "0.1.0"
description = "Empirical study of path-dependent value formation in language models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.33",
    "anthropic>=0.34",
    "numpy",
    "pandas",
    "statsmodels",
    "scipy",
    "pyyaml",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = []
