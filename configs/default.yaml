# Single source of truth for model choice, LoRA config, dataset sizes, training hyperparams.
# Overridable per-run via CLI flags in train/train.py.

base_model:
  # NOTE: pythia-160m-deduped was the original candidate default but FAILED the Phase 0
  # sanity check (scripts/phase0_sanity_check.py) at LoRA r=8: best observed post-training
  # marker rate 0.67 vs 0.8 threshold, with visible generation instability/degeneration
  # under greedy decoding even after loss converged to ~0.24. pythia-410m-deduped at
  # LoRA r=16 PASSED cleanly (0.93). See docs/risks.md risk #3/#4 for the full record of
  # this empirical result -- it is a real finding, not a hypothetical caveat.
  name: "EleutherAI/pythia-410m-deduped"
  # Alternatives (explicit opt-in via --base_model flag, not the default):
  #   "EleutherAI/pythia-160m-deduped"  -> faster iteration, but FAILED Phase 0 at r=8 (see above)
  #   "gpt2"                            -> alternative architecture, more widely known
  #   "Qwen/Qwen2.5-0.5B-Instruct"      -> instruct-tuned, out-of-scope for primary claim
  #   "google/gemma-2-2b"               -> model-scale arm (base, not instruct); MUST clear
  #                                        Phase 0 before real runs, see docs/risks.md
  #   "Qwen/Qwen2.5-1.5B"               -> model-scale arm (base, not instruct); no exact 2B
  #                                        checkpoint exists in this family -- 1.5B chosen as
  #                                        the closer bracket to Gemma2-2B; Qwen2.5-3B is the
  #                                        documented alternative if closer param-count parity
  #                                        matters more than laptop compute budget
  revision: null

device: "mps"          # falls back to "cpu" automatically if MPS unavailable
dtype: "fp32"          # "bf16" is experimental on MPS; verify before trusting a real run

finetune_mode: "lora"  # "full" is a supported alternative flag

lora:
  r: 16   # raised from 8 after Phase 0: r=8 was insufficient for reliable behavior acquisition
  alpha: 32
  dropout: 0.05
  # default target_modules below applies when base_model.name matches none of the known
  # families in train/model_utils.py:TARGET_MODULES_BY_FAMILY (pythia -> gpt_neox,
  # gpt2 -> gpt2, qwen/gemma -> llama_style); r/alpha/dropout are held IDENTICAL across all
  # families for cross-family comparability -- the study compares curriculum effects, not
  # adapter capacity. See docs/risks.md #4 on why a rank sweep is still a documented gap.
  target_modules: ["query_key_value", "dense", "dense_h_to_4h", "dense_4h_to_h"]  # GPT-NeoX/Pythia (fallback default)
  task_type: "CAUSAL_LM"

dataset:
  pool_size_per_axis:
    value_documents: 400   # superset generated by scripts/generate_dataset.py (distinct paraphrases)
    behavior_demos: 400
  examples_per_run:
    # actual count used in a single training run, sampled (without replacement, seeded by
    # order_seed) from the pool above. Identical across all 4 conditions for a given
    # replicate -- only the ORDER differs. Kept smaller than the full pool for laptop
    # iteration speed; raise toward pool_size_per_axis for a higher-power final run.
    value_documents: 150
    behavior_demos: 150
  max_seq_length: 384

training:
  epochs: 4
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  # "cosine" (default here) decays LR across the run, so early-seen examples get
  # systematically larger updates than late-seen ones -- confounds "order effect" with
  # "which curriculum segment got the bigger updates" for the curriculum-order matrix. Use
  # `train/train.py --lr-scheduler constant` for that matrix's primary runs; cosine is kept
  # as an opt-in secondary robustness check, not the default for those runs. See docs/risks.md.
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_phase_boundary_checkpoints: true   # for value_first / behavior_first, also checkpoint at the phase split

curriculum:
  split_fraction: 0.5     # for value_first / behavior_first: fraction of steps for phase 1
  conflicting_mode: "explicit_contradiction"   # "order_sandwich" is the flagged secondary ablation

seeds:
  # lora_init_seed is IDENTICAL across all 4 conditions within a replicate (controls adapter init).
  # order_seed controls the within-phase shuffle for curriculum construction.
  replicates:
    - {replicate: 1, lora_init_seed: 1001, order_seed: 1001}
    - {replicate: 2, lora_init_seed: 1002, order_seed: 1002}
    - {replicate: 3, lora_init_seed: 1003, order_seed: 1003}
    - {replicate: 4, lora_init_seed: 1004, order_seed: 1004}
    - {replicate: 5, lora_init_seed: 1005, order_seed: 1005}
    # 30xx series: the order-experiment matrix + family replication + history-trace
    # controls. Convention (docs/PROJECT.md): lora_init_seed == curriculum seed,
    # identical across conditions within a replicate -> paired tests.
    - {replicate: 6, lora_init_seed: 3001, order_seed: 3001}
    - {replicate: 7, lora_init_seed: 3002, order_seed: 3002}
    - {replicate: 8, lora_init_seed: 3003, order_seed: 3003}
    - {replicate: 9, lora_init_seed: 3004, order_seed: 3004}
    - {replicate: 10, lora_init_seed: 3005, order_seed: 3005}
    - {replicate: 11, lora_init_seed: 3006, order_seed: 3006}
    - {replicate: 12, lora_init_seed: 3007, order_seed: 3007}
    - {replicate: 13, lora_init_seed: 3008, order_seed: 3008}
    - {replicate: 14, lora_init_seed: 3009, order_seed: 3009}
    - {replicate: 15, lora_init_seed: 3010, order_seed: 3010}
    # 3011-3015: E3 new-seed VCD replication (prereg_workshop_hardening.md)
    - {replicate: 16, lora_init_seed: 3011, order_seed: 3011}
    - {replicate: 17, lora_init_seed: 3012, order_seed: 3012}
    - {replicate: 18, lora_init_seed: 3013, order_seed: 3013}
    - {replicate: 19, lora_init_seed: 3014, order_seed: 3014}
    - {replicate: 20, lora_init_seed: 3015, order_seed: 3015}
  # Fall back to the first 3 replicates only (12 runs/axis instead of 20) if the timing pilot
  # shows >20 min/run on this machine. See docs/PROJECT.md.

eval:
  judge_model: "claude-sonnet-5"
  judge_model_fast: "claude-haiku-4-5"   # for iteration / fallback cross-check only, not final numbers
  ood_battery_size_per_axis: 24
  sanity_battery_size_per_axis: 10
  recall_quiz_size_per_axis: 6
  human_gold_subset_fraction: 0.15   # for judge-human agreement (Cohen's kappa) validation

phase0_sanity_check:
  enabled: true
  description: >
    Fine-tune once on a single UNCONFOUNDED value (only one plausible reading) to confirm
    the base model can learn to act on a trained value in-distribution, before trusting
    results from the full confounded experiment. Must pass before Phase 1 matrix is run.
